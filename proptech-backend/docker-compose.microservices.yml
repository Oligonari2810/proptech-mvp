version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: habitatpro_enterprise
      POSTGRES_USER: habitatpro_user
      POSTGRES_PASSWORD: habitatpro_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - habitatpro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitatpro_user -d habitatpro_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para caching y rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - habitatpro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de Autenticación
  auth-service:
    build: 
      context: .
      dockerfile: Dockerfile.auth
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=auth-service
      - PORT=8001
      - DATABASE_URL=postgresql://habitatpro_user:habitatpro_password@postgres:5432/habitatpro_enterprise
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=habitatpro-jwt-secret-key-enterprise
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - habitatpro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servicio de Propiedades
  property-service:
    build: 
      context: .
      dockerfile: Dockerfile.property
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=property-service
      - PORT=8002
      - DATABASE_URL=postgresql://habitatpro_user:habitatpro_password@postgres:5432/habitatpro_enterprise
      - REDIS_URL=redis://redis:6379/1
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - habitatpro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servicio de Valoración IA
  valuation-service:
    build: 
      context: .
      dockerfile: Dockerfile.valuation
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=valuation-service
      - PORT=8003
      - DATABASE_URL=postgresql://habitatpro_user:habitatpro_password@postgres:5432/habitatpro_enterprise
      - REDIS_URL=redis://redis:6379/2
      - AI_MODEL_PATH=/app/models/valuation_model.pkl
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - habitatpro-network
    volumes:
      - ./ai/models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servicio de Búsqueda
  search-service:
    build: 
      context: .
      dockerfile: Dockerfile.search
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=search-service
      - PORT=8004
      - DATABASE_URL=postgresql://habitatpro_user:habitatpro_password@postgres:5432/habitatpro_enterprise
      - REDIS_URL=redis://redis:6379/3
      - PROPERTY_SERVICE_URL=http://property-service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      property-service:
        condition: service_healthy
    networks:
      - habitatpro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servicio de Pagos
  payment-service:
    build: 
      context: .
      dockerfile: Dockerfile.payment
    ports:
      - "8005:8005"
    environment:
      - SERVICE_NAME=payment-service
      - PORT=8005
      - DATABASE_URL=postgresql://habitatpro_user:habitatpro_password@postgres:5432/habitatpro_enterprise
      - REDIS_URL=redis://redis:6379/4
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - habitatpro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servicio de IA Emocional
  ai-service:
    build: 
      context: .
      dockerfile: Dockerfile.ai
    ports:
      - "8006:8006"
    environment:
      - SERVICE_NAME=ai-service
      - PORT=8006
      - DATABASE_URL=postgresql://habitatpro_user:habitatpro_password@postgres:5432/habitatpro_enterprise
      - REDIS_URL=redis://redis:6379/5
      - AI_MODEL_PATH=/app/models/emotion_model.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - habitatpro-network
    volumes:
      - ./ai/models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build: 
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PROPERTY_SERVICE_URL=http://property-service:8002
      - VALUATION_SERVICE_URL=http://valuation-service:8003
      - SEARCH_SERVICE_URL=http://search-service:8004
      - PAYMENT_SERVICE_URL=http://payment-service:8005
      - AI_SERVICE_URL=http://ai-service:8006
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - auth-service
      - property-service
      - valuation-service
      - search-service
      - payment-service
      - ai-service
    networks:
      - habitatpro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Load Balancer Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api-gateway
    networks:
      - habitatpro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - habitatpro-network

  # Monitoring Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=habitatpro_grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - habitatpro-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  habitatpro-network:
    driver: bridge
