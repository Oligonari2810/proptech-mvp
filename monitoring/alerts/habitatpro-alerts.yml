groups:
- name: habitatpro-critical
  rules:
  - alert: HighErrorRate
    expr: rate(http_errors_total{error_type="5xx"}[5m]) > 0.1
    for: 2m
    labels:
      severity: critical
      environment: production
    annotations:
      summary: "High error rate detected"
      description: "5xx error rate exceeds 10% for more than 2 minutes"

  - alert: APILatencyHigh
    expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
    for: 3m
    labels:
      severity: warning
      environment: production
    annotations:
      summary: "High API latency detected"
      description: "95th percentile API latency exceeds 2 seconds"

  - alert: NoPropertiesInSystem
    expr: habitatpro_properties_total == 0
    for: 5m
    labels:
      severity: critical
      environment: production
    annotations:
      summary: "No properties in system"
      description: "System has zero properties for more than 5 minutes"

  - alert: FrontendJSErrors
    expr: rate(http_errors_total{error_type="frontend_js"}[10m]) > 0.05
    for: 2m
    labels:
      severity: warning
      environment: production
    annotations:
      summary: "Frontend JavaScript errors increasing"
      description: "Frontend JS error rate exceeds 5%"


